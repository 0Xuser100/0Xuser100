<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 286" width="1200" height="286" role="img" aria-label="Mahmoud Abdulhamid, AI engineer. A pipeline: documents, OCR with Document AI, embeddings, retrieval with Qdrant, a supervisor agent, human approval, then a stream over SSE.">
<defs>
  <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#00D4FF" stop-opacity="0"/>
    <stop offset="1" stop-color="#00D4FF" stop-opacity="0.55"/>
  </linearGradient>
  <radialGradient id="glow">
    <stop offset="0" stop-color="#00D4FF" stop-opacity="0.85"/>
    <stop offset="1" stop-color="#00D4FF" stop-opacity="0"/>
  </radialGradient>
</defs>
<style>
  @keyframes flow {
    0%   { transform: translateX(0px);    opacity: 0 }
    10%  { opacity: 1 }
    88%  { opacity: 1 }
    100% { transform: translateX(1080px); opacity: 0 }
  }
  .pulse { animation: flow 4.4s cubic-bezier(.45,.05,.55,.95) infinite }
  @media (prefers-reduced-motion: reduce) { .pulse { animation: none; opacity: 0 } }
</style>

<rect width="1200" height="286" fill="#0B0F14"/>

<!-- the spine -->
<line x1="60" y1="96" x2="1140" y2="96" stroke="#1E2A38" stroke-width="2.5"/>
<g>
  <line x1="110" y1="83" x2="110" y2="109" stroke="#1E2A38" stroke-width="1.5"/>
  <circle cx="110" cy="96" r="5" fill="#0B0F14" stroke="#00D4FF" stroke-width="2"/>
  <text x="110" y="62" text-anchor="middle" font-family="ui-monospace,'SF Mono','Cascadia Mono',Menlo,Consolas,monospace" font-size="20" fill="#F2F6FA">documents</text>
  <text x="110" y="130" text-anchor="middle" font-family="ui-monospace,'SF Mono','Cascadia Mono',Menlo,Consolas,monospace" font-size="14" fill="#7D8FA3">pdf / xlsx / docx</text>
</g>
<g>
  <line x1="306" y1="83" x2="306" y2="109" stroke="#1E2A38" stroke-width="1.5"/>
  <circle cx="306" cy="96" r="5" fill="#0B0F14" stroke="#00D4FF" stroke-width="2"/>
  <text x="306" y="62" text-anchor="middle" font-family="ui-monospace,'SF Mono','Cascadia Mono',Menlo,Consolas,monospace" font-size="20" fill="#F2F6FA">ocr</text>
  <text x="306" y="130" text-anchor="middle" font-family="ui-monospace,'SF Mono','Cascadia Mono',Menlo,Consolas,monospace" font-size="14" fill="#7D8FA3">Document AI</text>
</g>
<g>
  <line x1="502" y1="83" x2="502" y2="109" stroke="#1E2A38" stroke-width="1.5"/>
  <circle cx="502" cy="96" r="5" fill="#0B0F14" stroke="#00D4FF" stroke-width="2"/>
  <text x="502" y="62" text-anchor="middle" font-family="ui-monospace,'SF Mono','Cascadia Mono',Menlo,Consolas,monospace" font-size="20" fill="#F2F6FA">embed</text>
  <text x="502" y="130" text-anchor="middle" font-family="ui-monospace,'SF Mono','Cascadia Mono',Menlo,Consolas,monospace" font-size="14" fill="#7D8FA3">OpenAI</text>
</g>
<g>
  <line x1="698" y1="83" x2="698" y2="109" stroke="#1E2A38" stroke-width="1.5"/>
  <circle cx="698" cy="96" r="5" fill="#0B0F14" stroke="#00D4FF" stroke-width="2"/>
  <text x="698" y="62" text-anchor="middle" font-family="ui-monospace,'SF Mono','Cascadia Mono',Menlo,Consolas,monospace" font-size="20" fill="#F2F6FA">retrieve</text>
  <text x="698" y="130" text-anchor="middle" font-family="ui-monospace,'SF Mono','Cascadia Mono',Menlo,Consolas,monospace" font-size="14" fill="#7D8FA3">Qdrant</text>
</g>
<g>
  <line x1="894" y1="83" x2="894" y2="109" stroke="#1E2A38" stroke-width="1.5"/>
  <circle cx="894" cy="96" r="5" fill="#0B0F14" stroke="#00D4FF" stroke-width="2"/>
  <text x="894" y="62" text-anchor="middle" font-family="ui-monospace,'SF Mono','Cascadia Mono',Menlo,Consolas,monospace" font-size="20" fill="#F2F6FA">agents</text>
  <text x="894" y="130" text-anchor="middle" font-family="ui-monospace,'SF Mono','Cascadia Mono',Menlo,Consolas,monospace" font-size="14" fill="#7D8FA3">supervisor</text>
</g>
<g>
  <line x1="1090" y1="83" x2="1090" y2="109" stroke="#1E2A38" stroke-width="1.5"/>
  <circle cx="1090" cy="96" r="5" fill="#0B0F14" stroke="#00D4FF" stroke-width="2"/>
  <text x="1090" y="62" text-anchor="middle" font-family="ui-monospace,'SF Mono','Cascadia Mono',Menlo,Consolas,monospace" font-size="20" fill="#F2F6FA">stream</text>
  <text x="1090" y="130" text-anchor="middle" font-family="ui-monospace,'SF Mono','Cascadia Mono',Menlo,Consolas,monospace" font-size="14" fill="#7D8FA3">SSE</text>
</g>
<g>
  <path d="M 992 85 L 1003 96 L 992 107 L 981 96 Z" fill="#0B0F14" stroke="#FF7A5C" stroke-width="2"/>
  <line x1="992" y1="107" x2="992" y2="146" stroke="#FF7A5C" stroke-width="1" stroke-opacity="0.5"/>
  <text x="992" y="162" text-anchor="middle" font-family="ui-monospace,'SF Mono','Cascadia Mono',Menlo,Consolas,monospace" font-size="14" fill="#FF7A5C">you approve</text>
</g>

<!-- one orchestrated moment: data moving through the system -->
<g class="pulse" transform="translate(60 0)">
  <rect x="-118" y="94.5" width="118" height="2.5" fill="url(#trail)"/>
  <circle cx="0" cy="96" r="17" fill="url(#glow)"/>
  <circle cx="0" cy="96" r="4.5" fill="#00D4FF"/>
</g>

<text x="60" y="222" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="43" font-weight="700" letter-spacing="-1.3" fill="#F2F6FA">MAHMOUD ABDULHAMID</text>
<text x="62" y="252" font-family="ui-monospace,'SF Mono','Cascadia Mono',Menlo,Consolas,monospace" font-size="16.5" fill="#9FB3C8">AI engineer, production RAG and multi-agent systems</text>
<text x="1140" y="222" text-anchor="end" font-family="ui-monospace,'SF Mono','Cascadia Mono',Menlo,Consolas,monospace" font-size="14" fill="#7D8FA3">retries, dead letters, checkpoints</text>
<text x="1140" y="248" text-anchor="end" font-family="ui-monospace,'SF Mono','Cascadia Mono',Menlo,Consolas,monospace" font-size="14" fill="#7D8FA3">so one bad document never stops the queue</text>
</svg>
